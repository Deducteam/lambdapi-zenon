on:
  pull_request:
    types: [opened, synchronize, edited, reopened]
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        lambdapi-version: [dev, 3.0.0]
        lambdapi-stdlib-version: [1.4.0, 1.3.1, 1.3.0]

    runs-on: ubuntu-latest

    steps:
      - name: Check out library
        uses: actions/checkout@v7

      - name: Install ocaml and opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git
            lambdapi: https://github.com/deducteam/opam-lambdapi-repository.git

#      - name: Install required libraries
#        run: sudo apt-get install -y libev-dev

      - name: Install lambdapi.${{ matrix.lambdapi-version }}
        run: opam install lambdapi.${{ matrix.lambdapi-version }}
        if: matrix.lambdapi-version != 'dev'

      - name: Install lambdapi development version
        run: cd lambdapi; opam install .
        if: matrix.lambdapi-version == 'dev'

      - name: Install lambdapi-stdlib.${{ matrix.lambdapi-stdlib-version }}
        run: opam install lambdapi-stdlib.${{ matrix.lambdapi-stdlib-version }}

      - name: Check library
        run: |
          eval $(opam env)
          make
